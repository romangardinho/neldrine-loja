<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos Neldrine-loja</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container-produtos {
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card-produto {
            background: #fff;
            border-radius: 15px;
            padding: 10px;
            width: 100px;
            text-align: center;
            box-shadow: 0 4px 8px rgb(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .card-produto img {
            width: 100px;
            max-width: 200px;
            height: auto;
            display: block;
            margin: auto;
        }

        .card-produto:hover {
            transform: scale(1.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;

        }

        .img-produto {
            width: 5%;
            height: auto;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
            display: block;
            position: relative;
        }

        .nome-prod {
            font-weight: bold;
            color: #120731;
            margin: 5px 0;
        }

        .preco-prod {
            color: #28a745;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .btn-comprar {
            background-color: #25d366;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 20px;
            font-size: 14px;
            display: block;
        }

    </style>
</head>
<body style="background-color: #c4c2b4;">
    <header style="text-align: center; padding: 2opx;">
        <img src="imagens/logo neldrine loja.png" style="width: 80px; border-radius: 50%;">
        <h2 style="color: #120731;">Nosso Catálogo</h2>
    </header>
    
        <div class="container-produtos">
            <div class="card-produto">
                <img src="imagens/copo-termico.jpg" class="img-produto" alt="Produto">
                <p class="nome-prod">copo-termico</p>
                <p class="preco-prod">R$ 50,00</p>

                <a href="https://wa.me/5567984463920" class="btn-comprar">Eu quero!</a>
            </div>
            <div class="card-produto">
                <img src="imagens/Kit Tereré.webp" class="img-produto" alt="Produto">
                <p class="nome-prod">Kit Tereré</p>
                <p class="preco-prod">R$ 80,00</p>

                <a href="https://wa.me/5567984463920" class="btn-comprar">Eu quero!</a>
            </div>
        </div>
         
        <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    // Cole aqui o seu link ajustado (com ?output=csv no final)
    const csvUrl = " https://docs.google.com/spreadsheets/d/e/2PACX-1vQOvfHnwIswN0KaXu0FL52xtLzT1cSnaaMQQ6bBSWpAre1Sn3BD688pj7EMjjZd0gVT2BALtFQ5Cw28/pub?output=csv"; 

    fetch(csvUrl)
        .then(response => response.text())
        .then(csvText => {
            // O PapaParse converte o CSV para uma lista (JSON)
            Papa.parse(csvText, {
                header: true,
                complete: function(results) {
                    const container = document.querySelector(".container-produtos");
                    container.innerHTML = ""; // Limpa o que estava lá

                    // Cria um card para cada linha da planilha
                    results.data.forEach(item => {
                        if (item.NOME) { // Só cria se tiver nome
                            container.innerHTML += `
                                <div class="card-produto">
                                    <img src="${item.LINK_IMAGEM}" alt="${item.NOME}">
                                    <h3>${item.NOME}</h3>
                                    <p>R$ ${item.PRECO}</p>
                                    <a href="${item.LINK_WHATSAPP}" target="_blank">Eu quero!</a>
                                </div>
                            `;
                        }
                    });
                }
            });
        });
</script>

</body>
</html>
