<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos Neldrine-loja</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container-produtos {
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            /*grid-template-columns: repeat(auto-fit, minmax(150px, lfr));*/
            gap: 20px;
            /*max-width: 800px;*/
           /* margin: 0 auto;*/
        }

        .card-produto {
            background: #fff;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgb(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .card-produto:hover {
            transform: scale(1.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;

        }

        .img-produto {
            width: 20%;
            height: auto;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .nome-prod {
            font-weight: bold;
            color: #120731;
            margin: 5px 0;
        }

        .preco-prod {
            color: #28a745;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .btn-comprar {
            background-color: #25d366;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 20px;
            font-size: 14px;
            display: block;
        }

    </style>
</head>
<body style="background-color: #c4c2b4;">
    <header style="text-align: center; padding: 2opx;">
        <img src="imagens/logo neldrine loja.png" style="width: 80px; border-radius: 50%;">
        <h2 style="color: #120731;">Nosso Catálogo</h2>
    </header>
    
        <div class="container-produtos">
            <div class="card-produto">
                <img src="imagens/copo-termico.jpg" class="img-produto" alt="Produto">
                <p class="nome-prod">copo-termico</p>
                <p class="preco-prod">R$ 50,00</p>

                <a href="https://wa.me/5567984463920" class="btn-comprar">Eu quero!</a>
            </div>
            <div class="card-produto">
                <img src="imagens/Kit Tereré.webp" class="img-produto" alt="Produto">
                <p class="nome-prod">Kit Tereré</p>
                <p class="preco-prod">R$ 80,00</p>

                <a href="https://wa.me/5567984463920" class="btn-comprar">Eu quero!</a>
            </div>
        </div>
         

</body>
</html>
